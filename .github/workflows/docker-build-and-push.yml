name: Build and push Docker images

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  REGISTRY: docker.io
  IMAGE_BASE: ledmington/aspis-deps
  BUILDER_IMAGE: llvm21-builder

jobs:
  # Compiles LLVM exactly once. This image is an intermediate build input
  # shared by llvm21 and llvm-rust1.93 below - it is never pushed.
  build-llvm-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 1440  # 24 hours

    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h
          sudo apt-get remove -y '^dotnet-.*'
          sudo apt-get remove -y '^llvm-.*'
          sudo apt-get remove -y 'php.*'
          sudo apt-get remove -y '^mongodb-.*'
          sudo apt-get remove -y '^mysql-.*'
          sudo apt-get remove -y azure-cli google-cloud-cli google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune --all --volumes --force
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Build LLVM builder image
        run: |
          docker build -t ${BUILDER_IMAGE} -f llvm-builder/21/Dockerfile llvm-builder/21
          docker save ${BUILDER_IMAGE} -o /tmp/${BUILDER_IMAGE}.tar

      - name: Upload LLVM builder artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILDER_IMAGE }}
          path: /tmp/${{ env.BUILDER_IMAGE }}.tar
          retention-days: 1

  build-llvm-image:
    needs: build-llvm-builder
    runs-on: ubuntu-latest
    timeout-minutes: 1440  # 24 hours

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Download LLVM builder artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILDER_IMAGE }}
          path: /tmp

      - name: Load LLVM builder image
        run: docker load -i /tmp/${BUILDER_IMAGE}.tar

      - name: Build LLVM image
        run: |
          docker build \
            --build-arg BUILDER_IMAGE=${BUILDER_IMAGE} \
            -t ${REGISTRY}/${IMAGE_BASE}:llvm21 \
            -f llvm/21/Dockerfile llvm/21

      - name: Log in to the Container registry
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ledmington
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: ${{ github.ref == 'refs/heads/master' }}
        run: docker push ${REGISTRY}/${IMAGE_BASE}:llvm21

  build-llvm-rust-image:
    needs: build-llvm-builder
    runs-on: ubuntu-latest
    timeout-minutes: 1440  # 24 hours

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h
          sudo apt-get remove -y '^dotnet-.*'
          sudo apt-get remove -y '^llvm-.*'
          sudo apt-get remove -y 'php.*'
          sudo apt-get remove -y '^mongodb-.*'
          sudo apt-get remove -y '^mysql-.*'
          sudo apt-get remove -y azure-cli google-cloud-cli google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune --all --volumes --force
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Download LLVM builder artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILDER_IMAGE }}
          path: /tmp

      - name: Load LLVM builder image
        run: docker load -i /tmp/${BUILDER_IMAGE}.tar

      - name: Build LLVM+Rust image
        run: |
          docker build \
            --build-arg BUILDER_IMAGE=${BUILDER_IMAGE} \
            -t ${REGISTRY}/${IMAGE_BASE}:llvm-rust1.93 \
            -f llvm-rust/1.93/Dockerfile llvm-rust/1.93

      - name: Log in to the Container registry
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ledmington
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: ${{ github.ref == 'refs/heads/master' }}
        run: docker push ${REGISTRY}/${IMAGE_BASE}:llvm-rust1.93
